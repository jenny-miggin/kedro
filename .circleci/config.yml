version: 2.1

executors:
  python-linux:
    docker:
      - image: cimg/python:<<parameters.python-version>>
    parameters:
      python-version:
        type: string
    working_directory: ~/repo

  python-windows:
    machine:
      image: 'windows-server-2019-vs2019:2024.12.1'
    resource_class: windows.medium
    shell: powershell.exe
    working_directory: ~/repo

jobs:
  unit-tests-linux:
    parameters:
      python-version:
        type: string
    executor:
      name: python-linux
      python-version: <<parameters.python-version>>
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "kedro/templates/project/{{ cookiecutter.repo_name }}/requirements.txt" }}
      - run:
          name: Install dependencies
          command: |
            # Install uv first
            python -m pip install "uv==0.4.29"
            # Try installing with uv
            if uv pip install --system "kedro[test] @ ."; then
              echo "Successfully installed with uv"
            else
              echo "uv system install failed, using pip install"
              python -m pip install -e ".[test]"
            fi
            # Ensure pytest is installed and available
            python -m pip install pytest pytest-xdist pytest-mock pytest-cov
            # Verify pytest is available
            pytest --version
      - save_cache:
          key: v1-deps-{{ checksum "kedro/templates/project/{{ cookiecutter.repo_name }}/requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: pip freeze
          command: pip freeze
      - run:
          name: Run unit tests
          command: python -m pytest --numprocesses 4 --dist loadfile

  unit-tests-windows:
    parameters:
      python-version:
        type: string
    executor:
      name: python-windows
    steps:
      - checkout
      - run:
          name: Set up Python
          command: |
            choco install python --version=<<parameters.python-version>>
            refreshenv
      - run:
          name: Install make
          command: choco install make
      - run:
          name: Install dependencies
          command: |
            python -m pip install "uv==0.4.29"
            # Try installing with uv
            if (uv pip install --system "kedro[test] @ .") {
              Write-Host "Successfully installed with uv"
            } else {
              Write-Host "uv system install failed, using pip install"
              python -m pip install -e ".[test]"
            }
            # Ensure pytest is installed and available
            python -m pip install pytest pytest-xdist pytest-mock pytest-cov
            # Verify pytest is available
            pytest --version
      - run:
          name: pip freeze
          command: pip freeze
      - run:
          name: Run unit tests
          command: python -m pytest --numprocesses 4 --dist loadfile

workflows:
  unit-tests-matrix:
    jobs:
      - unit-tests-linux:
          matrix:
            parameters:
              python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]
      - unit-tests-windows:
          matrix:
            parameters:
              python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ] 