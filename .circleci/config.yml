version: 2.1

executors:
  python-linux:
    docker:
      - image: cimg/python:<<parameters.python-version>>
    parameters:
      python-version:
        type: string
    working_directory: ~/repo

  python-windows:
    machine:
      image: 'windows-server-2019-vs2019:2024.12.1'
    resource_class: windows.medium
    shell: powershell.exe
    working_directory: ~/repo

jobs:
  unit-tests-linux:
    parameters:
      python-version:
        type: string
    executor:
      name: python-linux
      python-version: <<parameters.python-version>>
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "kedro/templates/project/{{ cookiecutter.repo_name }}/requirements.txt" }}
      - run:
          name: Install dependencies
          command: |
            # Install uv
            python -m pip install "uv==0.4.29"
            # Try the normal installation first
            if ! uv pip install --system "kedro[test] @ ."; then
              echo "uv system install failed, falling back to pip install with --break-system-packages"
              python -m pip install --break-system-packages -e ".[test]"
            fi
            # Ensure pytest is available
            python -m pip install --break-system-packages pytest
      - save_cache:
          key: v1-deps-{{ checksum "kedro/templates/project/{{ cookiecutter.repo_name }}/requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: pip freeze
          command: uv pip freeze --system || pip freeze
      - run:
          name: Run unit tests
          command: make test

  unit-tests-windows:
    parameters:
      python-version:
        type: string
    executor:
      name: python-windows
    steps:
      - checkout
      - run:
          name: Set up Python
          command: |
            choco install python --version=<<parameters.python-version>>
            refreshenv
      - run:
          name: Install make
          command: choco install make
      - run:
          name: Install dependencies
          command: |
            python -m pip install "uv==0.4.29"
            # Try the normal installation first
            if (!(uv pip install --system "kedro[test] @ .")) {
              Write-Host "uv system install failed, falling back to pip install"
              python -m pip install -e ".[test]"
            }
            # Ensure pytest is available
            python -m pip install pytest
      - run:
          name: pip freeze
          command: |
            uv pip freeze --system
            if ($LASTEXITCODE -ne 0) { pip freeze }
      - run:
          name: Run unit tests
          command: make test

workflows:
  unit-tests-matrix:
    jobs:
      - unit-tests-linux:
          matrix:
            parameters:
              python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]
      - unit-tests-windows:
          matrix:
            parameters:
              python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ] 